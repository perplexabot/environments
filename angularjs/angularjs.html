    <!-- a script tag can either have a src or inline content, not both, hence why we have two script blocks -->
    <script type='text/javascript' src="./angular-1.4.4/angular.js"> </script>
    <script>
        var app = angular.module('myApp', []);
        app.controller('myCtrl', function($scope, $parse) {
            var key = 'search';
            $scope.query = {};
            $scope.query[key] = ["testing", "was", "z", "a"];
            //$scope.query[key] = ['a', 4,1, 3, 'alert'];
            var fn = $parse(key);
            $scope.ARR = fn($scope.query);
        });
    </script>
